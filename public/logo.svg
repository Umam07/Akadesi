<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="akadesi-shield-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#173A40" />
      <stop offset="50%" stop-color="#1D4F57" />
      <stop offset="100%" stop-color="#0E272B" />
    </linearGradient>

    <linearGradient id="akadesi-gold-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="akadesi-teal-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#4FB8B2" />
      <stop offset="100%" stop-color="#2F6A4A" />
    </linearGradient>

    <linearGradient id="akadesi-book-grad" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E7F0E8" />
    </linearGradient>

    <linearGradient id="akadesi-border-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)" />
      <stop offset="50%" stop-color="rgba(79, 184, 178, 0.5)" />
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0.4)" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Shield Base -->
  <rect x="3" y="3" width="94" height="94" rx="26" fill="url(#akadesi-shield-bg)" />
  <rect x="4" y="4" width="92" height="92" rx="25" fill="none" stroke="url(#akadesi-border-grad)" stroke-width="2.5" opacity="0.8" />

  <!-- 1. Star of Excellence -->
  <path d="M50 11 L52.2 16.5 L57.5 18.5 L52.2 20.5 L50 26 L47.8 20.5 L42.5 18.5 L47.8 16.5 Z" fill="url(#akadesi-gold-grad)" />

  <!-- 2. Graduation Cap (Toga) -->
  <polygon points="50,25 80,36 50,47 20,36" fill="url(#akadesi-teal-grad)" stroke="url(#akadesi-gold-grad)" stroke-width="2" stroke-linejoin="round" />
  <path d="M32 41.5 V48 C32 53.5 68 53.5 68 48 V41.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.95" />
  <path d="M74 38.5 C76 43 78 48 78 54" fill="none" stroke="url(#akadesi-gold-grad)" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="78" cy="55.5" r="2.8" fill="url(#akadesi-gold-grad)" />

  <!-- 3. Open Book of Knowledge -->
  <path d="M50 54 C40 48 27 48 19 52.5 V73.5 C27 69 40 69 50 75 Z" fill="url(#akadesi-book-grad)" stroke="url(#akadesi-teal-grad)" stroke-width="1.8" stroke-linejoin="round" />
  <path d="M50 54 C60 48 73 48 81 52.5 V73.5 C73 69 60 69 50 75 Z" fill="url(#akadesi-book-grad)" stroke="url(#akadesi-teal-grad)" stroke-width="1.8" stroke-linejoin="round" />
  <line x1="50" y1="54" x2="50" y2="75" stroke="url(#akadesi-gold-grad)" stroke-width="2.8" stroke-linecap="round" />

  <!-- Book Lines -->
  <path d="M27 59.5 C34 56.5 42 56.5 45 58" fill="none" stroke="#328F97" stroke-width="1.6" stroke-linecap="round" opacity="0.75" />
  <path d="M27 65.5 C34 62.5 42 62.5 45 64" fill="none" stroke="#328F97" stroke-width="1.6" stroke-linecap="round" opacity="0.75" />
  <path d="M55 58 C58 56.5 66 56.5 73 59.5" fill="none" stroke="#328F97" stroke-width="1.6" stroke-linecap="round" opacity="0.75" />
  <path d="M55 64 C58 62.5 66 62.5 73 65.5" fill="none" stroke="#328F97" stroke-width="1.6" stroke-linecap="round" opacity="0.75" />

  <!-- Pedestal -->
  <path d="M38 78.5 C44 81 56 81 62 78.5" fill="none" stroke="url(#akadesi-gold-grad)" stroke-width="2.5" stroke-linecap="round" />
</svg>
